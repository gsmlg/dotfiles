name: Emacs configuration

on:
  pull_request:
    paths:
      - "emacs.d/**"
      - "install.sh"
      - "test-emacs-startup.sh"
      - "lint-emacs-config.sh"
      - "run-emacs-tests.sh"
      - "AGENTS.md"
      - ".github/workflows/test-emacs.yml"
  push:
    paths:
      - "emacs.d/**"
      - "install.sh"
      - "test-emacs-startup.sh"
      - "lint-emacs-config.sh"
      - "run-emacs-tests.sh"
      - "AGENTS.md"
      - ".github/workflows/test-emacs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Standalone lint / Emacs 30.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out dotfiles
        uses: actions/checkout@v7.0.1

      - name: Install GNU Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: "30.2"

      - name: Record installed Emacs identity
        id: emacs
        shell: bash
        run: |
          version="$(emacs -Q --batch --eval '(princ emacs-version)')"
          identity="$(
            emacs -Q --batch \
              --eval '(princ (format "%s|%S|%S" emacs-version emacs-repository-version emacs-build-time))' |
              shasum -a 256 |
              awk '{print $1}'
          )"
          printf 'cache-id=%s-%s\n' "$version" "$identity" >>"$GITHUB_OUTPUT"

      - name: Cache locked Elpaca data
        id: elpaca-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/gsmlg-ci-emacs/emacs/elpaca
          key: ${{ runner.os }}-emacs-${{ steps.emacs.outputs.cache-id }}-elpaca-${{ hashFiles('emacs.d/elpaca-lock.el') }}

      - name: Prime package data after a cache miss
        if: steps.elpaca-cache.outputs.cache-hit != 'true'
        env:
          GSMLG_EMACS_TEST_ROOT: ${{ runner.temp }}/gsmlg-emacs-lint-prime
          GSMLG_EMACS_STARTUP_MODE: reuse
        run: >-
          GSMLG_EMACS_TEST_DATA_HOME="$HOME/.local/share/gsmlg-ci-emacs"
          ./test-emacs-startup.sh

      - name: Run standalone lint offline
        env:
          GSMLG_EMACS_TEST_ROOT: ${{ runner.temp }}/gsmlg-emacs-lint
        run: |
          env -u GSMLG_EMACS_TEST_DATA_HOME \
            XDG_DATA_HOME="$HOME/.local/share/gsmlg-ci-emacs" \
            GSMLG_EMACS_OFFLINE=1 \
            ./lint-emacs-config.sh

  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            emacs-version: "30.2"
            advisory: false
          - os: macos-latest
            emacs-version: "30.2"
            advisory: false
          - os: ubuntu-latest
            emacs-version: snapshot
            advisory: true

    steps:
      - name: Check out dotfiles
        uses: actions/checkout@v7.0.1

      - name: Install GNU Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Record installed Emacs identity
        id: emacs
        shell: bash
        run: |
          version="$(emacs -Q --batch --eval '(princ emacs-version)')"
          identity="$(
            emacs -Q --batch \
              --eval '(princ (format "%s|%S|%S" emacs-version emacs-repository-version emacs-build-time))' |
              shasum -a 256 |
              awk '{print $1}'
          )"
          printf 'cache-id=%s-%s\n' "$version" "$identity" >>"$GITHUB_OUTPUT"

      - name: Cache locked Elpaca data
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/gsmlg-ci-emacs/emacs/elpaca
          key: ${{ runner.os }}-emacs-${{ steps.emacs.outputs.cache-id }}-elpaca-${{ hashFiles('emacs.d/elpaca-lock.el') }}

      - name: Exercise a forced-fresh bootstrap
        env:
          GSMLG_EMACS_TEST_ROOT: ${{ runner.temp }}/gsmlg-emacs-fresh
          GSMLG_EMACS_STARTUP_MODE: fresh
        run: ./test-emacs-startup.sh

      - name: Run complete Emacs suite
        env:
          GSMLG_EMACS_TEST_ROOT: ${{ runner.temp }}/gsmlg-emacs-suite
          GSMLG_EMACS_STARTUP_MODE: reuse
        run: >-
          GSMLG_EMACS_TEST_DATA_HOME="$HOME/.local/share/gsmlg-ci-emacs"
          ./run-emacs-tests.sh
