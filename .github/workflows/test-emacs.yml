name: CI test emacs

on:
  pull_request:
  push:
    paths:
    - 'emacs.d/**'
    - '!emacs.d/**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs_version:
          - 29.4
          - 30.2
          - snapshot
        include:
          - os: macos-latest
            emacs_version: 30.2
    steps:
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: actions/checkout@v2
    - name: Check startup
      run: ./test-emacs-startup.sh
    - name: Test Agent Editor MCP
      run: ./emacs.d/site-lisp/agent-editor-mcp/run_tests.sh
